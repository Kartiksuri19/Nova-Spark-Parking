<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Console Logger</title>
</head>
<body>
<pre id="log"></pre>
<script>
const logs = [];
function addLog(type, msg) {
  logs.push('[' + type + '] ' + msg);
  document.getElementById('log').textContent = logs.join('\n');
}

window.addEventListener('message', (e) => {
  if (e.data && e.data.__log) {
    addLog(e.data.__log.type, e.data.__log.msg);
  }
});
</script>
<iframe id="testFrame" src="index.html#google" style="width:1000px;height:700px;border:none;"></iframe>
<script>
setTimeout(() => {
  document.title = 'DONE: ' + logs.length + ' logs';
}, 3000);
</script>
</body>
</html>
